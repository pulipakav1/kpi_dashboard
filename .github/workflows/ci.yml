name: SaaS KPI Dashboard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  dbt-validate:
    name: dbt Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_pass
          POSTGRES_DB: saas_analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_USER: dbt_user
      DBT_PASSWORD: dbt_pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install dbt-postgres faker pandas numpy openpyxl

      - name: Generate synthetic data
        run: python generate_saas_data.py

      - name: Load data into PostgreSQL
        run: psql "postgresql://dbt_user:dbt_pass@localhost:5432/saas_analytics" -f db_setup.sql

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          saas_kpi:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: dbt_user
                password: dbt_pass
                dbname: saas_analytics
                schema: public
                threads: 4
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt compile
        working-directory: dbt
        run: dbt compile

      - name: dbt run
        working-directory: dbt
        run: dbt run

      - name: dbt test
        working-directory: dbt
        run: dbt test

      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-docs
          path: dbt/target/

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check generate_saas_data.py tests/
